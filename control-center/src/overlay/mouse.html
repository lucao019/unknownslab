<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>Unknowns Lab — Mouse Overlay</title>
    <link rel="stylesheet" href="overlay-controls.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: visible;  /* permite glow do pip extravazar */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 14px 14px 6px 14px;
        }

        .mouse {
            position: relative;
            width: 80px;
            height: 120px;
        }

        .mouse__body {
            position: absolute;
            inset: 0;
            border-radius: 40px 40px 36px 36px;
            border: 2px solid rgba(255,255,255,0.12);
            background: rgba(10, 10, 12, 0.72);
            backdrop-filter: blur(4px);
            overflow: hidden;
        }

        .mouse__divider {
            position: absolute;
            left: 50%; top: 0;
            width: 1.5px; height: 52%;
            background: rgba(255,255,255,0.10);
            transform: translateX(-50%);
            z-index: 2;
        }

        .mouse__btn {
            position: absolute;
            top: 0; width: 50%; height: 52%;
            transition: background 100ms ease, box-shadow 100ms ease;
        }

        .mouse__btn--lmb { left: 0;  border-radius: 38px 0 0 0; background: rgba(255,255,255,0.04); }
        .mouse__btn--rmb { right: 0; border-radius: 0 38px 0 0; background: rgba(255,255,255,0.04); }

        .mouse__wheel {
            position: absolute;
            left: 50%; top: 16%;
            transform: translateX(-50%);
            width: 12px; height: 26px;
            border-radius: 6px;
            border: 1.5px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06);
            z-index: 3;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 3px 0; overflow: hidden;
            transition: border-color 100ms ease;
        }

        .mouse__scroll-up, .mouse__scroll-down {
            width: 5px; height: 5px; border-radius: 2px;
            background: rgba(255,255,255,0.15);
            transition: background 100ms ease, box-shadow 100ms ease;
        }

        .mouse__wheel.active {
            border-color: rgba(245,197,24,0.8);
            background: rgba(245,197,24,0.2);
        }

        .mouse__side {
            position: absolute; left: -10px;  /* lado esquerdo */
            width: 8px; height: 22px;
            border-radius: 4px 0 0 4px;       /* arredonda lado esquerdo */
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.10);
            transition: background 100ms ease, border-color 100ms ease;
        }

        .mouse__side--m4 { top: 52%; }   /* M4 embaixo */
        .mouse__side--m5 { top: 35%; }   /* M5 em cima */

        .mouse__label {
            position: absolute; bottom: 14%; left: 50%;
            transform: translateX(-50%);
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 9px; font-weight: 700;
            letter-spacing: 0.08em; color: rgba(255,255,255,0.2);
            white-space: nowrap; z-index: 4; text-align: center;
            min-height: 12px; transition: color 150ms ease;
        }

        .active-lmb .mouse__btn--lmb,
        .active-rmb .mouse__btn--rmb {
            background: rgba(245,197,24,0.85) !important;
            box-shadow: inset 0 0 16px rgba(245,197,24,0.4), 0 0 12px rgba(245,197,24,0.5);
        }

        .active-scroll-up   .mouse__scroll-up,
        .active-scroll-down .mouse__scroll-down {
            background: rgba(245,197,24,0.9);
            box-shadow: 0 0 6px rgba(245,197,24,0.8);
        }

        .active-m4 .mouse__side--m4,
        .active-m5 .mouse__side--m5 {
            background: rgba(245,197,24,0.85);
            border-color: rgba(245,197,24,0.8);
        }

        .releasing-lmb .mouse__btn--lmb,
        .releasing-rmb .mouse__btn--rmb { background: rgba(245,197,24,0.25) !important; }

        .releasing-m4 .mouse__side--m4,
        .releasing-m5 .mouse__side--m5  { background: rgba(245,197,24,0.25); }

        .scroll-arrow {
            position: absolute; left: 50%;
            transform: translateX(-50%);
            font-size: 8px; color: rgba(245,197,24,0);
            transition: color 100ms ease;
            z-index: 5; pointer-events: none;
            font-family: "Segoe UI", sans-serif;
        }
        .scroll-arrow--up   { top: -18px; }
        .scroll-arrow--down { bottom: 28%; }
        .show-scroll-up   .scroll-arrow--up   { color: rgba(245,197,24,0.9); }
        .show-scroll-down .scroll-arrow--down { color: rgba(245,197,24,0.9); }
    </style>
</head>
<body data-overlay-kind="mouse" data-base-width="140" data-base-height="220">

<div class="overlay-wrap">

    <!-- Botões flutuantes discretos -->
    <div class="overlay-bar">
        <button class="obar-btn obar-btn--drag" data-action="drag" title="Mover">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
        </button>
        <button class="obar-btn obar-btn--hide" data-action="hide" title="Esconder">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
        <button class="obar-btn obar-btn--close" data-action="close" title="Fechar">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <!-- PIP — ícone de mouse (aparece quando hidden) -->
    <div class="overlay-pip" title="Arrastar para mover · Clicar para mostrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="7"/>
            <path d="M12 2v6"/>
            <path d="M5 10h14"/>
        </svg>
    </div>

    <!-- Conteúdo -->
    <div class="overlay-content">
        <div class="mouse" id="mouse">
            <div class="mouse__body">
                <div class="mouse__btn mouse__btn--lmb"></div>
                <div class="mouse__btn mouse__btn--rmb"></div>
                <div class="mouse__divider"></div>
                <div class="mouse__wheel" id="wheel">
                    <span class="mouse__scroll-up"></span>
                    <span class="mouse__scroll-down"></span>
                </div>
                <div class="mouse__label" id="mouse-label"></div>
            </div>
            <div class="mouse__side mouse__side--m4"></div>
            <div class="mouse__side mouse__side--m5"></div>
            <span class="scroll-arrow scroll-arrow--up">▲</span>
            <span class="scroll-arrow scroll-arrow--down">▼</span>
        </div>
    </div>

</div>

<script src="mouse-overlay.js"></script>
<script src="overlay-controls.js"></script>
</body>
</html>
