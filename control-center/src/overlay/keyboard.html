<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>Unknowns Lab — Keyboard Overlay</title>
    <link rel="stylesheet" href="overlay-controls.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 6px;
        }

        .overlay-wrap {
            align-items: flex-start;
        }

        /* ── TECLA BASE ── */
        .key {
            width: 46px;
            height: 46px;
            border-radius: 8px;
            border: 1.5px solid rgba(255,255,255,0.12);
            background: rgba(10, 10, 12, 0.72);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: rgba(255,255,255,0.35);
            transition:
                background 100ms ease,
                border-color 100ms ease,
                color 100ms ease,
                transform 80ms ease,
                box-shadow 100ms ease;
            user-select: none;
        }

        .key--space { width: 150px; font-size: 10px; letter-spacing: 0.12em; }
        .key--wide  { width: 70px; }

        .key.active {
            background: rgba(245, 197, 24, 0.92);
            border-color: rgba(255, 220, 80, 0.9);
            color: #0d0d0f;
            transform: scale(0.93);
            box-shadow: 0 0 12px rgba(245,197,24,0.6), 0 0 24px rgba(245,197,24,0.25);
        }

        .key.releasing {
            background: rgba(245, 197, 24, 0.35);
            border-color: rgba(245, 197, 24, 0.4);
            color: rgba(245, 197, 24, 0.8);
            transform: scale(1);
            box-shadow: 0 0 8px rgba(245, 197, 24, 0.2);
        }

        .kb {
            display: inline-flex;
            flex-direction: column;
            gap: 5px;
            padding: 4px 2px;
        }

        .kb__row {
            display: flex;
            gap: 5px;
        }
    </style>
</head>
<body>

<div class="overlay-wrap">

    <!-- Barra de controles -->
    <div class="overlay-bar">
        <button class="obar-btn obar-btn--drag" data-action="drag" title="Mover">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
        </button>
        <span class="obar-label">KEYBOARD</span>
        <button class="obar-btn obar-btn--hide" data-action="hide" title="Esconder">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
        <button class="obar-btn obar-btn--close" data-action="close" title="Fechar módulo">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <!-- PIP — mira PUBG (restaurar quando hidden, arrastar pra mover) -->
    <div class="overlay-pip" title="Arrastar para mover · Clicar para mostrar">
        <!-- Mira estilo PUBG: círculo + cruz + ponto central -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="12" cy="12" r="7"/>
            <line x1="12" y1="2"  x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2"  y1="12" x2="6"  y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
    </div>

    <!-- Conteúdo -->
    <div class="overlay-content">
        <div class="kb" id="kb">
            <div class="kb__row">
                <div class="key" data-key="Q">Q</div>
                <div class="key" data-key="W">W</div>
                <div class="key" data-key="E">E</div>
                <div class="key" data-key="R">R</div>
                <div class="key" data-key="T">T</div>
            </div>
            <div class="kb__row">
                <div class="key" data-key="A">A</div>
                <div class="key" data-key="S">S</div>
                <div class="key" data-key="D">D</div>
                <div class="key" data-key="F">F</div>
                <div class="key" data-key="G">G</div>
            </div>
            <div class="kb__row">
                <div class="key key--wide" data-key="SHIFT">SHIFT</div>
                <div class="key" data-key="Z">Z</div>
                <div class="key" data-key="C">C</div>
                <div class="key" data-key="V">V</div>
                <div class="key" data-key="B">B</div>
                <div class="key" data-key="M">M</div>
            </div>
            <div class="kb__row">
                <div class="key key--wide" data-key="CTRL">CTRL</div>
                <div class="key key--space" data-key="SPACE">SPACE</div>
                <div class="key" data-key="TAB">TAB</div>
                <div class="key" data-key="ESC">ESC</div>
            </div>
        </div>
    </div>

</div>

<script src="keyboard-overlay.js"></script>
<script src="overlay-controls.js"></script>
</body>
</html>
