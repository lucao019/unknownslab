<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="overlay.css">

    <title>PUBG Stats</title>
</head>

<body>

    <main class="overlay">

        <div class="stat">
            <div class="ghost"></div>

            <span class="label">KILLS</span>
            <strong id="kills">0</strong>
        </div>


        <div class="stat">
            <div class="ghost"></div>

            <span class="label">DAMAGE</span>
            <strong id="damage">0</strong>
        </div>


        <div class="stat">
            <div class="ghost"></div>

            <span class="label">MATCHES</span>
            <strong id="partidas">0</strong>
        </div>


        <div class="stat">
            <div class="ghost"></div>

            <span class="label">ONLINE</span>
            <strong id="online">0</strong>
        </div>

        <div class="stat weapon">
            <div class="ghost"></div>

            <span class="label">ARMA</span>
            <strong id="arma">-</strong>

            <small>
                <span id="killsArma">0</span> KILLS
            </small>
        </div>

    </main>


    <script src="overlay.js"></script>

</body>
</html>
